[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-negotiator-engine"
version = "0.1.0"
description = "Dealer-Counter AI core evaluation engine: fee audit, invoice-floor clamp, anti-deflection scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "rapidfuzz>=3.10.0",
  "streamlit>=1.40.0",
  "httpx>=0.27.0",
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
gemini = ["google-generativeai>=0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "app*", "web*"]
